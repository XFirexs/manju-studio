<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧工作室 - AI漫剧分镜制作</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 80px;
        }
        
        /* 顶部导航 */
        .header {
            background: rgba(15, 15, 35, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .logo-text {
            font-size: 16px;
            font-weight: 600;
        }
        .header-btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        /* 主容器 */
        .main-container {
            max-width: 1800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        /* 工具栏 */
        .toolbar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .toolbar-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn-add-row {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-left: auto;
        }
        .btn-add-row:hover {
            opacity: 0.9;
        }
        
        /* 分镜行 */
        .scene-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .scene-number {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }
        .btn-delete-row {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* 6列网格布局 */
        .scene-grid {
            display: grid;
            grid-template-columns: 200px 180px 200px 280px 200px 280px;
            gap: 15px;
            align-items: start;
        }
        
        /* 通用输入框 */
        .input-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 120px;
        }
        .input-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }
        .input-textarea, .input-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 12px;
            width: 100%;
            resize: none;
        }
        .input-textarea:focus, .input-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-textarea {
            min-height: 80px;
        }
        
        /* 人物三视图 */
        .character-views {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .view-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .view-box:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .view-box img {
            max-width: 100%;
            max-height: 60px;
            object-fit: contain;
            border-radius: 4px;
        }
        .view-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }
        .view-box.uploaded {
            border-color: #22c55e;
        }
        
        /* 图片生成框 */
        .image-gen-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }
        .image-gen-box.has-image {
            border-style: solid;
            border-color: #667eea;
            padding: 10px;
        }
        .image-preview {
            width: 100%;
            max-height: 160px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
        }
        .image-preview:hover {
            opacity: 0.9;
        }
        .btn-gen-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-gen-image:hover {
            opacity: 0.9;
        }
        .btn-gen-image:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .progress-bar-mini {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-bar-mini.active {
            display: block;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        
        /* 参考图上传区 */
        .reference-upload {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .ref-thumb {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
        .btn-add-ref {
            width: 40px;
            height: 40px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 18px;
        }
        .btn-add-ref:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        /* 视频提示词 */
        .video-prompt-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-regen-prompt {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            align-self: flex-start;
        }
        .btn-regen-prompt:hover {
            background: rgba(102, 126, 234, 0.3);
        }
        
        /* 视频生成框 */
        .video-gen-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }
        .video-gen-box.has-video {
            border-style: solid;
            border-color: #667eea;
        }
        .video-preview {
            width: 100%;
            max-height: 160px;
            object-fit: contain;
            border-radius: 6px;
        }
        .btn-gen-video {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-gen-video:hover {
            opacity: 0.9;
        }
        .btn-gen-video:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 操作按钮组 */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-small {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-small:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-download {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        .btn-download:hover {
            background: rgba(34, 197, 94, 0.3);
        }
        
        /* 全屏预览 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .preview-modal.active {
            display: flex;
        }
        .preview-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .preview-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 10px;
        }
        
        /* 隐藏的文件输入 */
        .hidden-input {
            display: none;
        }
        
        /* 响应式 */
        @media (max-width: 1600px) {
            .scene-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }
        
        @media (max-width: 768px) {
            .scene-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 10px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-add-row {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">漫</div>
            <div class="logo-text">漫剧工作室 - 分镜制作</div>
        </div>
        <div>
            <button class="header-btn" onclick="showApiModal()">API配置</button>
            <button class="header-btn" onclick="saveAllData()">保存进度</button>
        </div>
    </div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-item">
                <span class="toolbar-label">生图模型：</span>
                <select id="image-model" class="toolbar-select">
                    <option value="nano-banana-fast">香蕉二 Fast</option>
                    <option value="nano-banana-2-cl">香蕉二 CL</option>
                    <option value="nano-banana-2-4k-cl">香蕉二 4K</option>
                </select>
            </div>
            <div class="toolbar-item">
                <span class="toolbar-label">视频模型：</span>
                <select id="video-model" class="toolbar-select">
                    <option value="VEO 3.1 Fast">Veo 3.1 Fast</option>
                    <option value="VEO 3.1 Fast 4K">Veo 3.1 Fast 4K</option>
                    <option value="VEO 3.1 Fast 多参考版">Veo 3.1 Fast 多参考版</option>
                </select>
            </div>
            <div class="toolbar-item">
                <span class="toolbar-label">图片比例：</span>
                <select id="image-ratio" class="toolbar-select">
                    <option value="16:9" selected>16:9</option>
                    <option value="9:16">9:16</option>
                    <option value="1:1">1:1</option>
                    <option value="4:3">4:3</option>
                </select>
            </div>
            <div class="toolbar-item">
                <span class="toolbar-label">图片大小：</span>
                <select id="image-size" class="toolbar-select">
                    <option value="1K" selected>1K</option>
                    <option value="2K">2K</option>
                    <option value="4K">4K</option>
                </select>
            </div>
            <button class="btn-add-row" onclick="addSceneRow()">+ 添加分镜</button>
        </div>
        
        <!-- 分镜列表容器 -->
        <div id="scenes-container">
            <!-- 动态添加分镜行 -->
        </div>
        
        <!-- 空状态提示 -->
        <div id="empty-state" style="text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.4);">
            <div style="font-size: 48px; margin-bottom: 20px;">📽️</div>
            <div style="font-size: 18px; font-weight: 500; margin-bottom: 10px;">开始创建你的漫剧分镜</div>
            <div style="font-size: 14px;">点击上方"添加分镜"按钮开始</div>
        </div>
    </div>
    
    <!-- 全屏预览 -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-content">
            <span class="preview-close" onclick="closePreview()">✕</span>
            <img id="preview-image-full" class="preview-image" alt="预览">
        </div>
    </div>
    
    <!-- API配置弹窗 -->
    <div id="api-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: rgba(15, 15, 35, 0.95); border-radius: 12px; padding: 30px; max-width: 450px; width: 90%;">
            <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff;">API配置</h3>
            <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                <div>
                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-bottom: 6px;">GRSai API Key</div>
                    <input type="password" id="grsai-key" style="width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 12px; color: #fff; font-size: 13px;" placeholder="输入GRSai API Key">
                </div>
                <div>
                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-bottom: 6px;">橘子AI API Key</div>
                    <input type="password" id="juzi-key" style="width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 12px; color: #fff; font-size: 13px;" placeholder="输入橘子AI API Key">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeApiModal()" style="flex: 1; background: rgba(255, 255, 255, 0.1); border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer;">取消</button>
                <button onclick="saveApiConfig()" style="flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer;">保存</button>
            </div>
        </div>
    </div>
    
    <!-- 隐藏的文件输入 -->
    <input type="file" id="ref-image-input" class="hidden-input" accept="image/*" multiple onchange="handleRefImageUpload(event)">
    <input type="file" id="view-upload-input" class="hidden-input" accept="image/*" onchange="handleViewUpload(event)">

    <script>
        // 配置
        const CONFIG = {
            grsai: { baseUrl: 'https://grsai.dakka.com.cn' },
            juzi: { baseUrl: 'http://juziaigc.com/open/api/video' },
            maxRefImages: 7
        };
        
        // 全局状态
        let scenes = [];
        let sceneCounter = 0;
        let currentUploadRow = null;
        let currentUploadView = null;
        
        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            loadAllData();
            
            // 如果没有数据，添加一个示例分镜
            if (scenes.length === 0) {
                addSceneRow();
            }
        });
        
        // 添加分镜行
        function addSceneRow() {
            sceneCounter++;
            const sceneId = 'scene_' + sceneCounter;
            
            const sceneData = {
                id: sceneId,
                number: sceneCounter,
                novel: '',
                imagePrompt: '',
                characterViews: { front: '', side: '', back: '' },
                generatedImage: null,
                referenceImages: [],
                videoPrompt: '',
                generatedVideo: null
            };
            
            scenes.push(sceneData);
            renderSceneRow(sceneData);
            updateEmptyState();
        }
        
        // 渲染分镜行
        function renderSceneRow(scene) {
            const container = document.getElementById('scenes-container');
            const rowHtml = `
                <div class="scene-row" id="${scene.id}">
                    <div class="scene-header">
                        <span class="scene-number">分镜 #${scene.number}</span>
                        <button class="btn-delete-row" onclick="deleteSceneRow('${scene.id}')">删除</button>
                    </div>
                    <div class="scene-grid">
                        <!-- 1. 小说原文 -->
                        <div class="input-box">
                            <div class="input-label">1. 小说原文</div>
                            <textarea class="input-textarea" placeholder="粘贴小说原文内容..." oninput="updateSceneData('${scene.id}', 'novel', this.value)">${scene.novel}</textarea>
                        </div>
                        
                        <!-- 2. 生图说明 -->
                        <div class="input-box">
                            <div class="input-label">2. 生图说明</div>
                            <textarea class="input-textarea" placeholder="描述要生成的画面..." oninput="updateSceneData('${scene.id}', 'imagePrompt', this.value)">${scene.imagePrompt}</textarea>
                        </div>
                        
                        <!-- 3. 人物三视图 -->
                        <div class="input-box">
                            <div class="input-label">3. 人物三视图</div>
                            <div class="character-views">
                                <div class="view-box ${scene.characterViews.front ? 'uploaded' : ''}" onclick="uploadView('${scene.id}', 'front')">
                                    ${scene.characterViews.front ? `<img src="${scene.characterViews.front}">` : '<span>+</span>'}
                                    <span class="view-label">正面</span>
                                </div>
                                <div class="view-box ${scene.characterViews.side ? 'uploaded' : ''}" onclick="uploadView('${scene.id}', 'side')">
                                    ${scene.characterViews.side ? `<img src="${scene.characterViews.side}">` : '<span>+</span>'}
                                    <span class="view-label">侧面</span>
                                </div>
                                <div class="view-box ${scene.characterViews.back ? 'uploaded' : ''}" onclick="uploadView('${scene.id}', 'back')">
                                    ${scene.characterViews.back ? `<img src="${scene.characterViews.back}">` : '<span>+</span>'}
                                    <span class="view-label">背面</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 4. 生图框 -->
                        <div class="image-gen-box ${scene.generatedImage ? 'has-image' : ''}" id="${scene.id}_image-box">
                            ${scene.generatedImage ? 
                                `<img src="${scene.generatedImage.url}" class="image-preview" onclick="previewImage('${scene.generatedImage.url}')" alt="生成的图片">
                                <div class="progress-bar-mini" id="${scene.id}_progress" style="display: none;"></div>
                                <div class="reference-upload">
                                    ${scene.referenceImages.map((img, idx) => `<img src="${img.url}" class="ref-thumb" onclick="previewImage('${img.url}')">`).join('')}
                                    ${scene.referenceImages.length < CONFIG.maxRefImages ? `<div class="btn-add-ref" onclick="uploadRefImage('${scene.id}')">+</div>` : ''}
                                </div>
                                <div class="action-buttons">
                                    <button class="btn-small btn-download" onclick="downloadImage('${scene.id}')">下载</button>
                                    <button class="btn-small" onclick="regenerateImage('${scene.id}')">重新生成</button>
                                </div>` :
                                `<div style="color: rgba(255, 255, 255, 0.4); font-size: 12px;">点击下方按钮生成图片</div>
                                <div class="progress-bar-mini" id="${scene.id}_progress"></div>
                                <div class="reference-upload">
                                    ${scene.referenceImages.map((img, idx) => `<img src="${img.url}" class="ref-thumb" onclick="previewImage('${img.url}')">`).join('')}
                                    ${scene.referenceImages.length < CONFIG.maxRefImages ? `<div class="btn-add-ref" onclick="uploadRefImage('${scene.id}')">+</div>` : ''}
                                </div>`
                            }
                            <button class="btn-gen-image" id="${scene.id}_btn-gen" onclick="generateImage('${scene.id}')">
                                <span>🎨</span><span>生成图片</span>
                            </button>
                        </div>
                        
                        <!-- 5. 视频提示词 -->
                        <div class="input-box video-prompt-box">
                            <div class="input-label">5. 视频提示词</div>
                            <textarea class="input-textarea" placeholder="描述视频内容..." oninput="updateSceneData('${scene.id}', 'videoPrompt', this.value)">${scene.videoPrompt}</textarea>
                            <button class="btn-regen-prompt" onclick="regenerateVideoPrompt('${scene.id}')">✨ 智能生成提示词</button>
                        </div>
                        
                        <!-- 6. 视频生成框 -->
                        <div class="video-gen-box ${scene.generatedVideo ? 'has-video' : ''}" id="${scene.id}_video-box">
                            ${scene.generatedVideo ? 
                                `<img src="${scene.generatedVideo.url || scene.generatedVideo}" class="video-preview" alt="生成的视频">` :
                                `<div style="color: rgba(255, 255, 255, 0.4); font-size: 12px;">先生成图片，再生成视频</div>`
                            }
                            <button class="btn-gen-video" id="${scene.id}_btn-gen-video" onclick="generateVideo('${scene.id}')" ${!scene.generatedImage ? 'disabled' : ''}>
                                <span>🎬</span><span>生成视频</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', rowHtml);
        }
        
        // 更新场景数据
        function updateSceneData(sceneId, field, value) {
            const scene = scenes.find(s => s.id === sceneId);
            if (scene) {
                scene[field] = value;
            }
        }
        
        // 上传参考图
        function uploadRefImage(sceneId) {
            currentUploadRow = sceneId;
            document.getElementById('ref-image-input').click();
        }
        
        function handleRefImageUpload(event) {
            const files = event.target.files;
            if (!currentUploadRow || files.length === 0) return;
            
            const scene = scenes.find(s => s.id === currentUploadRow);
            if (!scene) return;
            
            // 限制最多7张
            const remaining = CONFIG.maxRefImages - scene.referenceImages.length;
            const filesToProcess = Math.min(files.length, remaining);
            
            for (let i = 0; i < filesToProcess; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    scene.referenceImages.push({
                        url: e.target.result,
                        name: file.name
                    });
                    
                    // 如果达到上限，重新渲染
                    if (scene.referenceImages.length === CONFIG.maxRefImages || 
                        (i === filesToProcess - 1 && files.length === filesToProcess)) {
                        refreshSceneRow(currentUploadRow);
                    }
                };
                reader.readAsDataURL(file);
            }
            
            event.target.value = '';
        }
        
        // 上传三视图
        function uploadView(sceneId, viewType) {
            currentUploadRow = sceneId;
            currentUploadView = viewType;
            document.getElementById('view-upload-input').click();
        }
        
        function handleViewUpload(event) {
            const file = event.target.files[0];
            if (!currentUploadRow || !currentUploadView || !file) return;
            
            const scene = scenes.find(s => s.id === currentUploadRow);
            if (!scene) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                scene.characterViews[currentUploadView] = e.target.result;
                refreshSceneRow(currentUploadRow);
            };
            reader.readAsDataURL(file);
            
            event.target.value = '';
        }
        
        // 生成图片
        async function generateImage(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            const apiKey = document.getElementById('grsai-key').value;
            const model = document.getElementById('image-model').value;
            const aspectRatio = document.getElementById('image-ratio').value;
            const imageSize = document.getElementById('image-size').value;
            
            if (!apiKey) {
                alert('请先配置API Key');
                return;
            }
            
            if (!scene.imagePrompt && scene.referenceImages.length === 0) {
                alert('请输入生图说明或上传参考图');
                return;
            }
            
            // 更新UI
            const btn = document.getElementById(sceneId + '_btn-gen');
            const progressBar = document.getElementById(sceneId + '_progress');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span><span>生成中...</span>';
            progressBar.classList.add('active');
            progressBar.innerHTML = '<div class="progress-fill" style="width: 0%"></div>';
            
            try {
                // 调用API
                const response = await fetch(`${CONFIG.grsai.baseUrl}/v1/draw/nano-banana`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: scene.imagePrompt,
                        aspectRatio: aspectRatio,
                        imageSize: imageSize,
                        urls: scene.referenceImages.map(img => img.url),
                        webHook: '-1'
                    })
                });
                
                const data = await response.json();
                
                if (data.code === 0 && data.data && data.data.id) {
                    await pollImageResult(sceneId, data.data.id, scene);
                } else {
                    throw new Error(data.msg || '生成失败');
                }
            } catch (error) {
                alert('生成失败：' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<span>🎨</span><span>生成图片</span>';
                progressBar.classList.remove('active');
            }
        }
        
        // 轮询图片结果
        async function pollImageResult(sceneId, taskId, scene) {
            const apiKey = document.getElementById('grsai-key').value;
            const maxAttempts = 60;
            let attempts = 0;
            
            const pollInterval = setInterval(async () => {
                attempts++;
                
                if (attempts > maxAttempts) {
                    clearInterval(pollInterval);
                    alert('生成超时');
                    resetGenerateButton(sceneId);
                    return;
                }
                
                try {
                    const response = await fetch(`${CONFIG.grsai.baseUrl}/v1/draw/result`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({ id: taskId })
                    });
                    
                    const data = await response.json();
                    
                    if (data.code === 0 && data.data) {
                        const { progress, status, results } = data.data;
                        
                        // 更新进度
                        const progressBar = document.getElementById(sceneId + '_progress');
                        if (progressBar) {
                            progressBar.innerHTML = `<div class="progress-fill" style="width: ${progress}%"></div>`;
                        }
                        
                        if (status === 'succeeded' && results && results.length > 0) {
                            clearInterval(pollInterval);
                            
                            // 保存结果
                            scene.generatedImage = results[0];
                            refreshSceneRow(sceneId);
                        } else if (status === 'failed') {
                            clearInterval(pollInterval);
                            alert('生成失败：' + (data.data.failure_reason || '未知错误'));
                            resetGenerateButton(sceneId);
                        }
                    }
                } catch (error) {
                    console.error('轮询错误:', error);
                }
            }, 1000);
        }
        
        function resetGenerateButton(sceneId) {
            const btn = document.getElementById(sceneId + '_btn-gen');
            const progressBar = document.getElementById(sceneId + '_progress');
            
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<span>🎨</span><span>生成图片</span>';
            }
            if (progressBar) {
                progressBar.classList.remove('active');
            }
        }
        
        // 重新生成图片
        function regenerateImage(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            if (confirm('确认重新生成图片？当前图片将被替换。')) {
                scene.generatedImage = null;
                generateImage(sceneId);
            }
        }
        
        // 生成视频
        async function generateVideo(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene || !scene.generatedImage) return;
            
            const apiKey = document.getElementById('juzi-key').value;
            const model = document.getElementById('video-model').value;
            
            if (!apiKey) {
                alert('请先配置橘子AI API Key');
                return;
            }
            
            alert('视频生成功能开发中，敬请期待...');
        }
        
        // 刷新分镜行
        function refreshSceneRow(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            const oldRow = document.getElementById(sceneId);
            if (oldRow) {
                oldRow.remove();
            }
            renderSceneRow(scene);
        }
        
        // 删除分镜行
        function deleteSceneRow(sceneId) {
            if (confirm('确认删除该分镜？')) {
                scenes = scenes.filter(s => s.id !== sceneId);
                document.getElementById(sceneId).remove();
                updateEmptyState();
            }
        }
        
        // 预览图片
        function previewImage(imageUrl) {
            document.getElementById('preview-image-full').src = imageUrl;
            document.getElementById('preview-modal').classList.add('active');
        }
        
        // 关闭预览
        function closePreview() {
            document.getElementById('preview-modal').classList.remove('active');
        }
        
        // 下载图片
        function downloadImage(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene || !scene.generatedImage) return;
            
            const link = document.createElement('a');
            link.href = scene.generatedImage.url;
            link.download = `manju_scene_${scene.number}_${Date.now()}.png`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // 智能生成视频提示词
        function regenerateVideoPrompt(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            // 基于生图说明生成视频提示词
            if (scene.imagePrompt) {
                scene.videoPrompt = scene.imagePrompt + '，动态场景，流畅运镜';
                refreshSceneRow(sceneId);
            } else {
                alert('请先填写生图说明');
            }
        }
        
        // 保存所有数据
        function saveAllData() {
            localStorage.setItem('manju_scenes', JSON.stringify(scenes));
            localStorage.setItem('manju_scene_counter', sceneCounter);
            
            alert('进度已保存！');
        }
        
        // 加载所有数据
        function loadAllData() {
            const savedScenes = localStorage.getItem('manju_scenes');
            const savedCounter = localStorage.getItem('manju_scene_counter');
            
            if (savedScenes) {
                scenes = JSON.parse(savedScenes);
                sceneCounter = parseInt(savedCounter) || 0;
                
                scenes.forEach(scene => {
                    renderSceneRow(scene);
                });
                
                updateEmptyState();
            }
        }
        
        // 更新空状态
        function updateEmptyState() {
            const emptyState = document.getElementById('empty-state');
            if (scenes.length > 0) {
                emptyState.style.display = 'none';
            } else {
                emptyState.style.display = 'block';
            }
        }
        
        // API配置
        function showApiModal() {
            document.getElementById('api-modal').style.display = 'flex';
            
            const savedConfig = JSON.parse(localStorage.getItem('manju_api_config') || '{}');
            if (savedConfig.grsaiKey) document.getElementById('grsai-key').value = savedConfig.grsaiKey;
            if (savedConfig.juziKey) document.getElementById('juzi-key').value = savedConfig.juziKey;
        }
        
        function closeApiModal() {
            document.getElementById('api-modal').style.display = 'none';
        }
        
        function saveApiConfig() {
            const config = {
                grsaiKey: document.getElementById('grsai-key').value,
                juziKey: document.getElementById('juzi-key').value
            };
            localStorage.setItem('manju_api_config', JSON.stringify(config));
            closeApiModal();
            alert('API配置已保存');
        }
        
        // 点击预览弹窗外部关闭
        document.getElementById('preview-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePreview();
            }
        });
    </script>
</body>
</html>
