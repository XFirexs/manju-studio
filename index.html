<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧工作室 - 测试版</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #0f0f23; color: #fff; }
        .test-btn { background: #667eea; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; }
        .test-result { margin-top: 20px; padding: 20px; background: #1a1a3e; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>漫剧工作室 - 简单测试</h1>
    
    <button class="test-btn" onclick="testClick()">点击测试</button>
    
    <div class="test-result" id="result">
        点击按钮后结果会显示在这里
    </div>
    
    <script>
        function testClick() {
            document.getElementById('result').innerHTML = '<h2>✅ JavaScript正常工作！</h2><p>scenes数组长度: ' + scenes.length + '</p>';
        }
        
        // 全局变量
        let scenes = [];
        let sceneCounter = 0;
        
        // 页面加载时添加默认分镜
        window.onload = function() {
            console.log('页面加载了');
            if (scenes.length === 0) {
                sceneCounter = 1;
                scenes.push({id: 'scene_1', number: 1});
                document.getElementById('result').innerHTML = '<h2>✅ 默认分镜已添加！</h2><p>scenes数组长度: ' + scenes.length + '</p>';
            }
        };
    </script>
</body>
</html>
