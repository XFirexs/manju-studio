<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧工作室 - AI漫剧分镜制作</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 80px;
        }
        
        /* 顶部导航 */
        .header {
            background: rgba(15, 15, 35, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .logo-text {
            font-size: 16px;
            font-weight: 600;
        }
        .header-btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.4);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        /* 主容器 */
        .main-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        /* 工具栏 */
        .toolbar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .toolbar-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn-add-row {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-left: auto;
        }
        .btn-add-row:hover {
            opacity: 0.9;
        }
        
        /* 分镜行 */
        .scene-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .scene-number {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }
        .btn-delete-row {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* 3列网格布局 */
        .scene-grid {
            display: grid;
            grid-template-columns: 280px 1fr 1fr;
            gap: 20px;
            align-items: start;
        }
        
        /* 板块样式 */
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-header {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-icon {
            font-size: 16px;
        }
        
        /* 7个参考图区域 */
        .ref-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .ref-slot {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .ref-slot:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .ref-slot.has-image {
            border-style: solid;
            border-color: #22c55e;
        }
        .ref-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }
        .ref-slot .upload-icon {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
        }
        .ref-number {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        /* 3个视频参考图 */
        .video-ref-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .video-ref-slot {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .video-ref-slot:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        .video-ref-slot.has-image {
            border-style: solid;
            border-color: #22c55e;
        }
        .video-ref-slot.has-generated-image {
            border-style: solid;
            border-color: #667eea;
        }
        .video-ref-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }
        .video-ref-slot .upload-icon {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4);
        }
        .video-ref-number {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        /* 通用输入框 */
        .input-textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 12px;
            width: 100%;
            resize: none;
            min-height: 60px;
        }
        .input-textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* 图片生成框 */
        .image-preview-box {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .image-preview-box.has-image {
            border-style: solid;
            border-color: #667eea;
            padding: 8px;
        }
        .image-preview {
            width: 100%;
            max-height: 140px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
        }
        .image-preview:hover {
            opacity: 0.9;
        }
        .empty-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            text-align: center;
            padding: 10px;
        }
        
        /* 按钮 */
        .btn-gen-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-gen-image:hover {
            opacity: 0.9;
        }
        .btn-gen-image:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-gen-video {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-gen-video:hover {
            opacity: 0.9;
        }
        .btn-gen-video:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-regen-prompt {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            align-self: flex-start;
        }
        .btn-regen-prompt:hover {
            background: rgba(102, 126, 234, 0.3);
        }
        
        .btn-small {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-small:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-download {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        .btn-download:hover {
            background: rgba(34, 197, 94, 0.3);
        }
        
        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active {
            display: block;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        
        /* 操作按钮组 */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        /* 提示信息 */
        .hint-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            text-align: center;
            margin-top: 5px;
        }
        
        /* 全屏预览 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .preview-modal.active {

        /* 超时提示模态框 */
        .timeout-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 3000;
            text-align: center;
            min-width: 300px;
        }
        .timeout-modal.active {
            display: block;
        }
        .timeout-modal h3 {
            font-size: 24px;
            color: #e74c3c;
            margin-bottom: 15px;
        }
        .timeout-modal p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .timeout-modal button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .timeout-modal button:hover {
            background: #c0392b;
        }
            display: flex;
        }
        .preview-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .preview-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 10px;
        }
        
        /* 隐藏的文件输入 */
        .hidden-input {
            display: none;
        }
        
        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .scene-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
        
        @media (max-width: 768px) {
            .ref-grid, .video-ref-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .header {
                flex-direction: column;
                gap: 10px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-add-row {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">漫</div>
            <div class="logo-text">漫剧工作室 - 分镜制作</div>
        </div>
        <div>
            <button class="header-btn" onclick="showApiModal()">API配置</button>
            <button class="header-btn" onclick="saveAllData()">保存进度</button>
        </div>
    </div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-item">
                <span class="toolbar-label">生图模型：</span>
                <select id="image-model" class="toolbar-select">
                    <option value="nano-banana-fast">香蕉二 Fast</option>
                    <option value="nano-banana-2-cl">香蕉二 CL</option>
                    <option value="nano-banana-2-4k-cl">香蕉二 4K</option>
                </select>
            </div>
            <div class="toolbar-item">
                <span class="toolbar-label">视频模型：</span>
                <select id="video-model" class="toolbar-select">
                    <option value="VEO 3.1 Fast">Veo 3.1 Fast</option>
                    <option value="VEO 3.1 Fast 4K">Veo 3.1 Fast 4K</option>
                    <option value="VEO 3.1 Fast 多参考版">Veo 3.1 Fast 多参考版</option>
                </select>
            </div>
            <div class="toolbar-item">
                <span class="toolbar-label">图片比例：</span>
                <select id="image-ratio" class="toolbar-select">
                    <option value="16:9" selected>16:9</option>
                    <option value="9:16">9:16</option>
                    <option value="1:1">1:1</option>
                    <option value="4:3">4:3</option>
                </select>
            </div>
            <div class="toolbar-item">
                <span class="toolbar-label">图片大小：</span>
                <select id="image-size" class="toolbar-select">
                    <option value="1K" selected>1K</option>
                    <option value="2K">2K</option>
                    <option value="4K">4K</option>
                </select>
            </div>
            <button class="btn-add-row" onclick="addSceneRow()">+ 添加分镜</button>
        </div>
        
        <!-- 分镜列表容器 -->
        <div id="scenes-container">
            <!-- 动态添加分镜行 -->
        </div>
        
        <!-- 空状态提示 -->
        <div id="empty-state" style="text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.4);">
            <div style="font-size: 48px; margin-bottom: 20px;">📽️</div>
            <div style="font-size: 18px; font-weight: 500; margin-bottom: 10px;">开始创建你的漫剧分镜</div>
            <div style="font-size: 14px;">点击上方"添加分镜"按钮开始</div>
        </div>
    </div>
    
    <!-- 全屏预览 -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-content">
            <span class="preview-close" onclick="closePreview()">✕</span>
            <img id="preview-image-full" class="preview-image" alt="预览">
        </div>
    </div>
    
    <!-- API配置弹窗 -->
    <div id="api-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 2000; align-items: center; justify-content: center;">
    <div class="timeout-modal" id="timeout-modal">
        <h3>⏱️ 生成超时</h3>
        <p>图片生成时间超过5分钟，请检查网络或稍后重试。</p>
        <button onclick="closeTimeoutModal()">确定</button>
    </div>
        <div style="background: rgba(15, 15, 35, 0.95); border-radius: 12px; padding: 30px; max-width: 450px; width: 90%;">
            <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff;">API配置</h3>
            <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                <div>
                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-bottom: 6px;">GRSai API Key</div>
                    <input type="password" id="grsai-key" style="width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 12px; color: #fff; font-size: 13px;" placeholder="输入GRSai API Key">
                </div>
                <div>
                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-bottom: 6px;">橘子AI API Key</div>
                    <input type="password" id="juzi-key" style="width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 12px; color: #fff; font-size: 13px;" placeholder="输入橘子AI API Key">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeApiModal()" style="flex: 1; background: rgba(255, 255, 255, 0.1); border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer;">取消</button>
                <button onclick="saveApiConfig()" style="flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer;">保存</button>
            </div>
        </div>
    </div>
    
    <!-- 隐藏的文件输入 -->
    <input type="file" id="ref-image-input" class="hidden-input" accept="image/*" multiple onchange="handleRefImageUpload(event)">
    <input type="file" id="video-ref-input" class="hidden-input" accept="image/*" multiple onchange="handleVideoRefUpload(event)">

    <script>
        // 配置
        const CONFIG = {
            grsai: { baseUrl: 'https://grsai.dakka.com.cn' },
            juzi: { baseUrl: 'http://juziaigc.com/open/api/video' },
            maxRefImages: 7,
            maxVideoRefImages: 3
        };
        
        // 全局状态
        let scenes = [];
        let sceneCounter = 0;
        let currentUploadSceneId = null;
        let currentUploadRefIndex = null;
        let currentVideoRefIndex = null;
        
        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            loadAllData();
            
            if (scenes.length === 0) {
                addSceneRow();
            }
        });
        
        // 添加分镜行
        function addSceneRow() {
            const maxNumber = scenes.reduce((max, scene) => Math.max(max, scene.number), 0);
            sceneCounter = maxNumber + 1;
            const sceneId = 'scene_' + sceneCounter;
            const sceneData = {
                id: sceneId,
                number: sceneCounter,
                imagePrompt: '',
                referenceImages: new Array(7).fill(null),
                generatedImage: null,
                videoPrompt: '',
                videoRefImages: new Array(3).fill(null),
                generatedVideo: null,
                progress: 0,
                status: '',
            };
            scenes.push(sceneData);
            renderSceneRow(sceneData);
            updateEmptyState();
        }
        
        // 渲染分镜行
        function renderSceneRow(scene) {
            const container = document.getElementById('scenes-container');
            
            // 生成7个参考图槽位HTML
            let refSlotsHtml = '';
            for (let i = 0; i < 7; i++) {
                const hasImage = scene.referenceImages[i] !== null;
                refSlotsHtml += `
                    <div class="ref-slot ${hasImage ? 'has-image' : ''}" 
                         onclick="uploadRefImage('${scene.id}', ${i})"
                         id="${scene.id}_ref_${i}">
                        ${hasImage ? 
                            `<img src="${scene.referenceImages[i]}">` : 
                            `<span class="upload-icon">+</span>`
                        }
                        <span class="ref-number">${i + 1}</span>
                    </div>
                `;
            }
            
            // 生成3个视频参考图槽位HTML
            let videoRefSlotsHtml = '';
            for (let i = 0; i < 3; i++) {
                const hasImage = scene.videoRefImages[i] !== null;
                const isGeneratedImage = i === 0 && scene.generatedImage && scene.videoRefImages[0] === scene.generatedImage;
                
                videoRefSlotsHtml += `
                    <div class="video-ref-slot ${hasImage ? 'has-image' : ''} ${isGeneratedImage ? 'has-generated-image' : ''}" 
                         onclick="uploadVideoRefImage('${scene.id}', ${i})"
                         id="${scene.id}_video_ref_${i}">
                        ${hasImage ? 
                            `<img src="${scene.videoRefImages[i]}">` : 
                            `<span class="upload-icon">+</span>`
                        }
                        <span class="video-ref-number">${i + 1}</span>
                    </div>
                `;
            }
            
            const rowHtml = `
                <div class="scene-row" id="${scene.id}">
                    <div class="scene-header">
                        <span class="scene-number">分镜 #${scene.number}</span>
                        <button class="btn-delete-row" onclick="deleteSceneRow('${scene.id}')">删除</button>
                    </div>
                    <div class="scene-grid">
                        <!-- 第1列：7个参考图 -->
                        <div class="panel">
                            <div class="panel-header">
                                <span class="panel-icon">🖼️</span>
                                参考图（7张）
                            </div>
                            <div class="ref-grid">
                                ${refSlotsHtml}
                            </div>
                        </div>
                        
                        <!-- 第2列：生图说明 + 生成图片 -->
                        <div class="panel">
                            <div class="panel-header">
                                <span class="panel-icon">🎨</span>
                                图片生成
                            </div>
                            <textarea class="input-textarea" placeholder="描述要生成的画面..." 
                                      oninput="updateSceneData('${scene.id}', 'imagePrompt', this.value)">${scene.imagePrompt}</textarea>
                            <div class="image-preview-box ${scene.generatedImage ? 'has-image' : ''}" id="${scene.id}_image-box">
                                ${scene.generatedImage ? 
                                    `<img src="${scene.generatedImage}" class="image-preview" onclick="previewImage('${scene.generatedImage}')" alt="生成的图片">` :
                                    '<div class="empty-hint">生成图片后会显示在这里</div>'
                                }
                            </div>
                            <div class="progress-bar" id="${scene.id}_progress"></div>
                            <button class="btn-gen-image" id="${scene.id}_btn-gen" onclick="generateImage('${scene.id}')">
                                <span>🎨</span><span id="${scene.id}_btn-text">生成图片</span>
                            </button>
                            ${scene.generatedImage ? `
                                <div class="action-buttons">
                                    <button class="btn-small btn-download" onclick="downloadImage('${scene.id}')">下载</button>
                                    <button class="btn-small" onclick="regenerateImage('${scene.id}')">重新生成</button>
                                </div>
                            ` : ''}
                        </div>
                        
                        <!-- 第3列：视频提示词 + 生成视频 -->
                        <div class="panel">
                            <div class="panel-header">
                                <span class="panel-icon">🎬</span>
                                视频生成
                            </div>
                            <textarea class="input-textarea" placeholder="描述视频内容..." 
                                      oninput="updateSceneData('${scene.id}', 'videoPrompt', this.value)">${scene.videoPrompt}</textarea>
                            <div class="video-ref-grid" style="margin-top: 8px;">
                                ${videoRefSlotsHtml}
                            </div>
                            ${!scene.videoRefImages.some(img => img !== null) ? 
                                '<div class="hint-text">提示：生成图片后自动添加到参考图1</div>' : ''
                            }
                            <button class="btn-gen-video" id="${scene.id}_btn-gen-video" onclick="generateVideo('${scene.id}')" 
                                    ${!scene.videoRefImages.some(img => img !== null) ? 'disabled' : ''}>
                                <span>🎬</span>
                                <span id="${scene.id}_video-btn-text">
                                    ${!scene.videoRefImages.some(img => img !== null) ? '先生成图片或上传参考图' : '生成视频'}
                                </span>
                            </button>
                            <button class="btn-regen-prompt" onclick="regenerateVideoPrompt('${scene.id}')">✨ 智能生成提示词</button>
                        </div>
                    </div>
                </div>
            `;
            
            const existingRows = Array.from(container.children);
            let insertBefore = null;
            for (const row of existingRows) {
                const existingNumber = parseInt(row.id.replace('scene_', ''));
                if (existingNumber > scene.number) {
                    insertBefore = row;
                    break;
                }
            }
            if (insertBefore) {
                insertBefore.insertAdjacentHTML('beforebegin', rowHtml);
            } else {
                container.insertAdjacentHTML('beforeend', rowHtml);
            }
            
            if (scene.progress > 0 && scene.progress < 100) {
                const progressBar = document.getElementById(scene.id + '_progress');
                if (progressBar) {
                    progressBar.classList.add('active');
                    progressBar.innerHTML = `<div class="progress-fill" style="width: ${scene.progress}%"></div>`;
                }
            }
        }
        
        // 上传参考图
        function uploadRefImage(sceneId, refIndex) {
            currentUploadSceneId = sceneId;
            currentUploadRefIndex = refIndex;
            document.getElementById('ref-image-input').click();
        }
        
        function handleRefImageUpload(event) {
            const files = event.target.files;
            if (!currentUploadSceneId || currentUploadRefIndex === null || files.length === 0) return;
            
            const scene = scenes.find(s => s.id === currentUploadSceneId);
            if (!scene) return;
            
            const file = files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                scene.referenceImages[currentUploadRefIndex] = e.target.result;
                
                const refSlot = document.getElementById(currentUploadSceneId + '_ref_' + currentUploadRefIndex);
                if (refSlot) {
                    refSlot.classList.add('has-image');
                    refSlot.innerHTML = `
                        <img src="${e.target.result}">
                        <span class="ref-number">${currentUploadRefIndex + 1}</span>
                    `;
                }
                
                currentUploadSceneId = null;
                currentUploadRefIndex = null;
            };
            
            reader.readAsDataURL(file);
            event.target.value = '';
        }
        
        // 上传视频参考图
        function uploadVideoRefImage(sceneId, refIndex) {
            currentUploadSceneId = sceneId;
            currentVideoRefIndex = refIndex;
            document.getElementById('video-ref-input').click();
        }
        
        function handleVideoRefUpload(event) {
            const files = event.target.files;
            if (!currentUploadSceneId || currentVideoRefIndex === null || files.length === 0) return;
            
            const scene = scenes.find(s => s.id === currentUploadSceneId);
            if (!scene) return;
            
            const file = files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                scene.videoRefImages[currentVideoRefIndex] = e.target.result;
                
                const refSlot = document.getElementById(currentUploadSceneId + '_video_ref_' + currentVideoRefIndex);
                if (refSlot) {
                    refSlot.classList.add('has-image');
                    refSlot.innerHTML = `
                        <img src="${e.target.result}">
                        <span class="video-ref-number">${currentVideoRefIndex + 1}</span>
                    `;
                }
                
                // 立即更新视频生成按钮状态
                const videoBtn = document.getElementById(currentUploadSceneId + '_btn-gen-video');
                const videoBtnText = document.getElementById(currentUploadSceneId + '_video-btn-text');
                if (videoBtn && videoBtnText) {
                    const hasVideoRefs = scene.videoRefImages.some(img => img !== null);
                    if (hasVideoRefs) {
                        videoBtn.disabled = false;
                        videoBtnText.textContent = '生成视频';
                    }
                }
                
                currentUploadSceneId = null;
                currentVideoRefIndex = null;
            };
            
            reader.readAsDataURL(file);
            event.target.value = '';
        }
        
        // 更新场景数据
        function updateSceneData(sceneId, field, value) {
            const scene = scenes.find(s => s.id === sceneId);
            if (scene) {
                scene[field] = value;
            }
        }
        
        // 生成图片
        async function generateImage(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            const apiKey = document.getElementById('grsai-key').value;
            const model = document.getElementById('image-model').value;
            const aspectRatio = document.getElementById('image-ratio').value;
            const imageSize = document.getElementById('image-size').value;
            
            if (!apiKey) {
                alert('请先配置API Key（点击顶部"API配置"按钮）');
                return;
            }
            
            if (!scene.imagePrompt && !scene.referenceImages.some(img => img !== null)) {
                alert('请输入生图说明或上传参考图');
                return;
            }
            
            const btn = document.getElementById(sceneId + '_btn-gen');
            const progressBar = document.getElementById(sceneId + '_progress');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span><span id="' + sceneId + '_btn-text">生成中...</span>';
            progressBar.classList.add('active');
            progressBar.innerHTML = '<div class="progress-fill" style="width: 0%"></div>';
            
            scene.progress = 0;
            
            try {
                const validRefs = scene.referenceImages.filter(img => img !== null);
                
                const response = await fetch(`${CONFIG.grsai.baseUrl}/v1/draw/nano-banana`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: scene.imagePrompt || '',
                        aspectRatio: aspectRatio,
                        imageSize: imageSize,
                        urls: validRefs,
                        webHook: '-1'
                    })
                });
                
                if (!response.ok) {
                    throw new Error('请求失败: ' + response.status);
                }
                
                const data = await response.json();
                console.log('API响应:', data);
                
                if (data.code === 0 && data.data && data.data.id) {
                    await pollImageResult(sceneId, data.data.id, scene);
                } else {
                    throw new Error(data.msg || '生成失败');
                }
            } catch (error) {
                console.error('生成错误:', error);
                alert('生成失败：' + error.message);
                resetGenerateButton(sceneId);
            }
        }
        
        // 轮询图片结果
        async function pollImageResult(sceneId, taskId, scene) {
            const apiKey = document.getElementById('grsai-key').value;
            const maxAttempts = 300; // 5分钟
            let attempts = 0;
            
            const pollInterval = setInterval(async () => {
                attempts++;
                
                if (attempts > maxAttempts) {
                    clearInterval(pollInterval);
                    showTimeoutModal();
                    resetGenerateButton(sceneId);
                    return;
                }
                
                try {
                    const response = await fetch(`${CONFIG.grsai.baseUrl}/v1/draw/result`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({ id: taskId })
                    });
                    
                    if (!response.ok) {
                        throw new Error('轮询失败: ' + response.status);
                    }
                    
                    const data = await response.json();
                    console.log('轮询响应:', data);
                    
                    if (data.code === 0 && data.data) {
                        const { progress, status, results } = data.data;
                        
                        scene.progress = progress;
                        const progressBar = document.getElementById(sceneId + '_progress');
                        if (progressBar) {
                            progressBar.innerHTML = `<div class="progress-fill" style="width: ${progress}%"></div>`;
                        }
                        
                        if (status === 'succeeded' && results && results.length > 0) {
                            clearInterval(pollInterval);
                            
                            scene.generatedImage = results[0].url;
                            scene.progress = 100;
                            
                            // 自动添加到视频参考图的第一个位置
                            scene.videoRefImages[0] = scene.generatedImage;
                            
                            refreshSceneRow(sceneId);
                            
                            console.log('图片生成成功，已自动添加到视频参考图1');
                        } else if (status === 'failed') {
                            clearInterval(pollInterval);
                            alert('生成失败：' + (data.data.failure_reason || '未知错误'));
                            resetGenerateButton(sceneId);
                        }
                    }
                } catch (error) {
                    console.error('轮询错误:', error);
                }
            }, 1000);
        }
        
        function resetGenerateButton(sceneId) {
            const btn = document.getElementById(sceneId + '_btn-gen');
            const progressBar = document.getElementById(sceneId + '_progress');
            
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<span>🎨</span><span id="' + sceneId + '_btn-text">生成图片</span>';
            }
            if (progressBar) {
                progressBar.classList.remove('active');
            }
            
            const scene = scenes.find(s => s.id === sceneId);
            if (scene) {
                scene.progress = 0;
            }
        }
        
        // 重新生成图片
        function regenerateImage(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            if (confirm('确认重新生成图片？当前图片将被替换。')) {
                scene.generatedImage = null;
                scene.progress = 0;
                refreshSceneRow(sceneId);
                generateImage(sceneId);
            }
        }
        
        // 生成视频
        async function generateVideo(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            const apiKey = document.getElementById('juzi-key').value;
            const model = document.getElementById('video-model').value;
            
            if (!apiKey) {
                alert('请先配置橘子AI API Key');
                return;
            }
            
            if (!scene.videoPrompt) {
                alert('请输入视频提示词');
                return;
            }
            
            const validVideoRefs = scene.videoRefImages.filter(img => img !== null);
            if (validVideoRefs.length === 0) {
                alert('请上传视频参考图');
                return;
            }
            
            alert('视频生成功能开发中，敬请期待...');
        }
        
        // 刷新分镜行
        function refreshSceneRow(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            const oldRow = document.getElementById(sceneId);
            if (oldRow) {
                oldRow.remove();
            }
            renderSceneRow(scene);
        }
        
        // 删除分镜行
        function deleteSceneRow(sceneId) {
            if (confirm('确认删除该分镜？')) {
                scenes = scenes.filter(s => s.id !== sceneId);
                scenes.forEach((scene, index) => {
                    scene.number = index + 1;
                    scene.id = 'scene_' + (index + 1);
                });
                sceneCounter = scenes.length;
                const container = document.getElementById('scenes-container');
                container.innerHTML = '';
                scenes.forEach(scene => {
                    renderSceneRow(scene);
                });
                updateEmptyState();
            }
        }
        
        // 预览图片
        function previewImage(imageUrl) {
            document.getElementById('preview-image-full').src = imageUrl;
            document.getElementById('preview-modal').classList.add('active');
        }
        
        // 关闭预览
        function closePreview() {
        function showTimeoutModal() {
            document.getElementById('timeout-modal').classList.add('active');
        }
        function closeTimeoutModal() {
            document.getElementById('timeout-modal').classList.remove('active');
        }
            document.getElementById('preview-modal').classList.remove('active');
        }
        
        // 下载图片
        function downloadImage(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene || !scene.generatedImage) return;
            
            const link = document.createElement('a');
            link.href = scene.generatedImage;
            link.download = `manju_scene_${scene.number}_${Date.now()}.png`;
            link.style.display = 'none';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            window.open(scene.generatedImage, '_blank');
        }
        
        // 智能生成视频提示词
        function regenerateVideoPrompt(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            if (scene.imagePrompt) {
                scene.videoPrompt = scene.imagePrompt + '，动态场景，流畅运镜';
                const textarea = document.querySelector(`#${sceneId} textarea[oninput*="videoPrompt"]`);
                if (textarea) {
                    textarea.value = scene.videoPrompt;
                }
                alert('视频提示词已生成！');
            } else {
                alert('请先填写生图说明');
            }
        }
        
        // 保存所有数据
        function saveAllData() {
            const saveData = scenes.map(scene => ({
                ...scene,
                referenceImages: scene.referenceImages.map(img => img ? 'SAVED' : null),
                generatedImage: scene.generatedImage ? 'SAVED' : null,
                videoRefImages: scene.videoRefImages.map(img => img ? 'SAVED' : null)
            }));
            
            localStorage.setItem('manju_scenes', JSON.stringify(saveData));
            localStorage.setItem('manju_scene_counter', sceneCounter);
            
            alert('进度已保存！（注意：图片数据未保存，刷新后需要重新生成）');
        }
        
        // 加载所有数据
        function loadAllData() {
            const savedScenes = localStorage.getItem('manju_scenes');
            const savedCounter = localStorage.getItem('manju_scene_counter');
            
            if (savedScenes) {
                const parsedScenes = JSON.parse(savedScenes);
                sceneCounter = parseInt(savedCounter) || 0;
                
                scenes = parsedScenes.map(scene => ({
                    ...scene,
                    referenceImages: new Array(7).fill(null),
                    generatedImage: null,
                    videoRefImages: new Array(3).fill(null),
                    progress: 0,
                    status: ''
                }));
                
                scenes.forEach(scene => {
                    renderSceneRow(scene);
                });
                
                updateEmptyState();
            }
        }
        
        // 更新空状态
        function updateEmptyState() {
            const emptyState = document.getElementById('empty-state');
            if (scenes.length > 0) {
                emptyState.style.display = 'none';
            } else {
                emptyState.style.display = 'block';
            }
        }
        
        // API配置
        function showApiModal() {
            document.getElementById('api-modal').style.display = 'flex';
            
            const savedConfig = JSON.parse(localStorage.getItem('manju_api_config') || '{}');
            if (savedConfig.grsaiKey) document.getElementById('grsai-key').value = savedConfig.grsaiKey;
            if (savedConfig.juziKey) document.getElementById('juzi-key').value = savedConfig.juziKey;
        }
        
        function closeApiModal() {
            document.getElementById('api-modal').style.display = 'none';
        }
        
        function saveApiConfig() {
            const config = {
                grsaiKey: document.getElementById('grsai-key').value,
                juziKey: document.getElementById('juzi-key').value
            };
            localStorage.setItem('manju_api_config', JSON.stringify(config));
            closeApiModal();
            alert('API配置已保存');
        }
        
        // 点击预览弹窗外部关闭
        document.getElementById('preview-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePreview();
            }
        });
    </script>
</body>
</html>
