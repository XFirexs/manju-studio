<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧工作室 - 专业AI漫剧制作工作台</title>
    <meta name="description" content="AI驱动的小说转漫剧平台，一站式完成角色、分镜、视频制作">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }
        
        /* 顶部导航栏 */
        .header {
            background: rgba(26, 26, 46, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .logo-text {
            display: flex;
            flex-direction: column;
        }
        .logo-title {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .btn-header {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-header:hover {
            background: rgba(102, 126, 234, 0.3);
        }
        
        /* 主布局 */
        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            gap: 0;
            height: calc(100vh - 70px);
            overflow: hidden;
        }
        
        /* 左侧边栏 - 项目导航 */
        .sidebar-left {
            background: rgba(26, 26, 46, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .project-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .project-item:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .project-item.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .project-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }
        .project-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.3;
        }
        .project-meta {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 500;
        }
        .badge-draft { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-progress { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-done { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        
        /* 中间工作区 */
        .work-area {
            background: rgba(22, 33, 62, 0.5);
            padding: 20px;
            overflow-y: auto;
        }
        
        /* 工作区标签 */
        .work-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 10px;
        }
        .work-tab {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .work-tab:hover {
            color: rgba(255, 255, 255, 0.8);
        }
        .work-tab.active {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }
        
        /* AI生成面板 */
        .ai-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .panel-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .panel-title {
            font-size: 16px;
            font-weight: 600;
        }
        
        /* 模型选择器 */
        .model-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .model-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .model-card:hover {
            border-color: rgba(102, 126, 234, 0.5);
        }
        .model-card.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .model-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #fff;
        }
        .model-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* 表单区域 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
        }
        .form-input, .form-select, .form-textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 12px;
            color: white;
            font-size: 13px;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        /* 进度条 */
        .progress-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: none;
        }
        .progress-section.active {
            display: block;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .progress-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .progress-percent {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
        }
        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-status {
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* 生成结果展示 */
        .result-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: none;
        }
        .result-section.active {
            display: block;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .result-actions {
            display: flex;
            gap: 10px;
        }
        .btn-small {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-small:hover {
            background: rgba(102, 126, 234, 0.3);
        }
        .result-image-container {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            cursor: pointer;
        }
        .result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        .result-image:hover {
            transform: scale(1.02);
        }
        .result-info {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }
        .result-info-item {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }
        
        /* 按钮样式 */
        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 加载动画 */
        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 全屏预览 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .preview-modal.active {
            display: flex;
        }
        .preview-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .preview-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
        }
        .preview-download {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(102, 126, 234, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.5);
            color: #667eea;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .preview-download:hover {
            background: rgba(102, 126, 234, 0.4);
        }
        
        /* 右侧边栏 - 资源库 */
        .sidebar-right {
            background: rgba(26, 26, 46, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
        }
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .resource-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        .resource-item:hover {
            border-color: rgba(102, 126, 234, 0.5);
        }
        .resource-thumb {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }
        .resource-info {
            padding: 10px;
        }
        .resource-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #fff;
        }
        .resource-meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 200px 1fr;
            }
            .sidebar-right {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .sidebar-left {
                display: none;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">漫</div>
            <div class="logo-text">
                <div class="logo-title">漫剧工作室</div>
                <div class="logo-subtitle">AI漫剧制作工作台</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" onclick="showApiModal()">API配置</button>
            <button class="btn-header" onclick="showProjectModal()">新建项目</button>
        </div>
    </div>
    
    <!-- 主布局 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <div class="sidebar-left">
            <div class="sidebar-title">我的项目</div>
            <div class="project-list">
                <div class="project-item active">
                    <div class="project-name">示例项目</div>
                    <div class="project-desc">测试用项目</div>
                    <div class="project-meta">
                        <span class="badge badge-progress">进行中</span>
                        <span class="badge" style="background: rgba(102, 126, 234, 0.2); color: #667eea;">3个分镜</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 中间工作区 -->
        <div class="work-area">
            <!-- 工作区标签 -->
            <div class="work-tabs">
                <button class="work-tab active" onclick="switchWorkTab('ai')">AI生成</button>
                <button class="work-tab" onclick="switchWorkTab('characters')">角色管理</button>
                <button class="work-tab" onclick="switchWorkTab('scenes')">分镜管理</button>
            </div>
            
            <!-- AI生成面板 -->
            <div class="ai-panel">
                <div class="panel-header">
                    <div class="panel-icon">✨</div>
                    <div class="panel-title">AI图片生成</div>
                </div>
                
                <!-- 模型选择器 -->
                <div style="margin-bottom: 15px;">
                    <div class="form-label">选择模型</div>
                    <div class="model-selector">
                        <div class="model-card active" onclick="selectModel(this, 'nano-banana-fast')">
                            <div class="model-name">香蕉二 Fast</div>
                            <div class="model-desc">1K快速生成</div>
                        </div>
                        <div class="model-card" onclick="selectModel(this, 'nano-banana-2-cl')">
                            <div class="model-name">香蕉二 CL</div>
                            <div class="model-desc">1K标准质量</div>
                        </div>
                        <div class="model-card" onclick="selectModel(this, 'nano-banana-2-4k-cl')">
                            <div class="model-name">香蕉二 4K</div>
                            <div class="model-desc">4K高清画质</div>
                        </div>
                    </div>
                </div>
                
                <!-- 表单 -->
                <div class="form-grid">
                    <div class="form-group full-width">
                        <div class="form-label">提示词</div>
                        <textarea id="prompt-input" class="form-textarea" placeholder="输入生成描述，例如：一个可爱的猫咪在草地上玩耍，阳光明媚，风格温馨可爱"></textarea>
                    </div>
                    <div class="form-group">
                        <div class="form-label">宽高比</div>
                        <select id="aspect-ratio" class="form-select">
                            <option value="auto">自动</option>
                            <option value="16:9" selected>16:9 (横屏)</option>
                            <option value="9:16">9:16 (竖屏)</option>
                            <option value="1:1">1:1 (正方形)</option>
                            <option value="4:3">4:3 (经典)</option>
                            <option value="3:2">3:2 (电影)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <div class="form-label">图片大小</div>
                        <select id="image-size" class="form-select">
                            <option value="1K" selected>1K (快速)</option>
                            <option value="2K">2K (标准)</option>
                            <option value="4K">4K (高清)</option>
                        </select>
                    </div>
                </div>
                
                <!-- 生成按钮 -->
                <button class="btn-generate" onclick="generateImage()" id="btn-generate">
                    <span id="generate-icon">🎨</span>
                    <span id="generate-text">开始生成</span>
                </button>
                
                <!-- 进度条 -->
                <div class="progress-section" id="progress-section">
                    <div class="progress-header">
                        <span class="progress-label">生成进度</span>
                        <span class="progress-percent" id="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-status" id="progress-status">正在初始化生成任务...</div>
                </div>
                
                <!-- 生成结果 -->
                <div class="result-section" id="result-section">
                    <div class="result-header">
                        <span class="result-title">✨ 生成完成</span>
                        <div class="result-actions">
                            <button class="btn-small" onclick="previewImage()">预览</button>
                            <button class="btn-small" onclick="downloadImage()">下载</button>
                            <button class="btn-small" onclick="saveToResource()">保存到资源库</button>
                        </div>
                    </div>
                    <div class="result-image-container" onclick="previewImage()">
                        <img id="result-image" class="result-image" alt="生成的图片">
                    </div>
                    <div class="result-info">
                        <div class="result-info-item">
                            <span>生成时间</span>
                            <span id="result-time">-</span>
                        </div>
                        <div class="result-info-item">
                            <span>使用模型</span>
                            <span id="result-model">-</span>
                        </div>
                        <div class="result-info-item">
                            <span>图片尺寸</span>
                            <span id="result-size">-</span>
                        </div>
                        <div class="result-info-item">
                            <span>宽高比</span>
                            <span id="result-aspect">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 右侧资源库 -->
        <div class="sidebar-right">
            <div class="sidebar-title">资源库</div>
            <div class="resource-list" id="resource-list">
                <!-- 动态加载资源 -->
            </div>
        </div>
    </div>
    
    <!-- 全屏预览弹窗 -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-content">
            <span class="preview-close" onclick="closePreview()">✕</span>
            <img id="preview-image-full" class="preview-image" alt="预览图片">
            <button class="preview-download" onclick="downloadImage()">⬇️ 下载图片</button>
        </div>
    </div>
    
    <!-- API配置弹窗 -->
    <div id="api-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: #1a1a2e; border-radius: 12px; padding: 30px; max-width: 450px; width: 90%;">
            <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff;">API配置</h3>
            <div class="form-group" style="margin-bottom: 15px;">
                <div class="form-label">GRSai API Key</div>
                <input type="password" id="grsai-key" class="form-input" placeholder="输入你的GRSai API Key">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <div class="form-label">橘子AI API Key</div>
                <input type="password" id="juzi-key" class="form-input" placeholder="输入你的橘子AI API Key">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="closeApiModal()" style="flex: 1; background: rgba(255, 255, 255, 0.1); border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer;">取消</button>
                <button onclick="saveApiConfig()" style="flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer;">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            grsai: {
                baseUrl: 'https://grsai.dakka.com.cn'
            }
        };
        
        let currentModel = 'nano-banana-fast';
        let currentImage = null;
        let generationId = null;
        
        // 选择模型
        function selectModel(element, model) {
            document.querySelectorAll('.model-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            currentModel = model;
        }
        
        // 生成图片
        async function generateImage() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const aspectRatio = document.getElementById('aspect-ratio').value;
            const imageSize = document.getElementById('image-size').value;
            const apiKey = document.getElementById('grsai-key').value;
            
            if (!prompt) {
                alert('请输入提示词');
                return;
            }
            
            if (!apiKey) {
                alert('请先配置API Key（点击顶部"API配置"按钮）');
                return;
            }
            
            // 检查今日生成次数
            if (hasGeneratedToday()) {
                alert('今日测试次数已达上限，请明天再试');
                return;
            }
            
            // 更新UI状态
            const btn = document.getElementById('btn-generate');
            const progressSection = document.getElementById('progress-section');
            const resultSection = document.getElementById('result-section');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span><span>生成中...</span>';
            progressSection.classList.add('active');
            resultSection.classList.remove('active');
            
            updateProgress(0, '正在初始化生成任务...');
            
            try {
                // 调用GRSai API（webHook设置为-1，立即返回任务ID）
                const response = await fetch(`${CONFIG.grsai.baseUrl}/v1/draw/nano-banana`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        prompt: prompt,
                        aspectRatio: aspectRatio,
                        imageSize: imageSize,
                        urls: [],
                        webHook: '-1'
                    })
                });
                
                if (!response.ok) {
                    throw new Error('请求失败');
                }
                
                const data = await response.json();
                
                if (data.code === 0 && data.data && data.data.id) {
                    generationId = data.data.id;
                    await pollGenerationResult(generationId);
                } else {
                    throw new Error(data.msg || '生成失败');
                }
            } catch (error) {
                updateProgress(0, '生成失败：' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<span>🎨</span><span>开始生成</span>';
            }
        }
        
        // 轮询生成结果
        async function pollGenerationResult(taskId) {
            const apiKey = document.getElementById('grsai-key').value;
            const maxAttempts = 60; // 最多轮询60次（约60秒）
            let attempts = 0;
            
            updateProgress(10, '生成任务已创建，正在处理中...');
            
            const pollInterval = setInterval(async () => {
                attempts++;
                
                if (attempts > maxAttempts) {
                    clearInterval(pollInterval);
                    updateProgress(0, '生成超时，请重试');
                    document.getElementById('btn-generate').disabled = false;
                    document.getElementById('btn-generate').innerHTML = '<span>🎨</span><span>开始生成</span>';
                    return;
                }
                
                try {
                    const response = await fetch(`${CONFIG.grsai.baseUrl}/v1/draw/result`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({ id: taskId })
                    });
                    
                    if (!response.ok) {
                        throw new Error('轮询失败');
                    }
                    
                    const data = await response.json();
                    
                    if (data.code === 0 && data.data) {
                        const { progress, status, results } = data.data;
                        
                        // 更新进度
                        const displayProgress = Math.min(progress, 99);
                        updateProgress(displayProgress, getProgressText(progress, status));
                        
                        // 检查是否完成
                        if (status === 'succeeded' && results && results.length > 0) {
                            clearInterval(pollInterval);
                            
                            // 显示结果
                            showResult(results[0], data.data);
                            
                            // 记录生成历史
                            recordGeneration();
                        } else if (status === 'failed') {
                            clearInterval(pollInterval);
                            updateProgress(0, '生成失败：' + (data.data.failure_reason || '未知错误'));
                            document.getElementById('btn-generate').disabled = false;
                            document.getElementById('btn-generate').innerHTML = '<span>🎨</span><span>开始生成</span>';
                        }
                    }
                } catch (error) {
                    console.error('轮询错误:', error);
                }
            }, 1000); // 每秒轮询一次
        }
        
        // 更新进度条
        function updateProgress(percent, status) {
            document.getElementById('progress-percent').textContent = percent + '%';
            document.getElementById('progress-bar-fill').style.width = percent + '%';
            document.getElementById('progress-status').textContent = status;
        }
        
        // 获取进度文本
        function getProgressText(progress, status) {
            if (progress < 30) return '正在初始化AI模型...';
            if (progress < 60) return '正在解析提示词...';
            if (progress < 90) return '正在生成图片...';
            return '即将完成...';
        }
        
        // 显示结果
        function showResult(result, data) {
            const resultSection = document.getElementById('result-section');
            const progressSection = document.getElementById('progress-section');
            const btn = document.getElementById('btn-generate');
            
            // 保存当前图片信息
            currentImage = result;
            
            // 显示图片
            document.getElementById('result-image').src = result.url;
            document.getElementById('result-time').textContent = new Date().toLocaleString();
            document.getElementById('result-model').textContent = currentModel;
            document.getElementById('result-size').textContent = document.getElementById('image-size').value;
            document.getElementById('result-aspect').textContent = document.getElementById('aspect-ratio').value;
            
            // 更新UI
            progressSection.classList.remove('active');
            resultSection.classList.add('active');
            btn.disabled = false;
            btn.innerHTML = '<span>🎨</span><span>开始生成</span>';
        }
        
        // 预览图片
        function previewImage() {
            if (!currentImage) return;
            
            document.getElementById('preview-image-full').src = currentImage.url;
            document.getElementById('preview-modal').classList.add('active');
        }
        
        // 关闭预览
        function closePreview() {
            document.getElementById('preview-modal').classList.remove('active');
        }
        
        // 下载图片
        function downloadImage() {
            if (!currentImage) return;
            
            const link = document.createElement('a');
            link.href = currentImage.url;
            link.download = 'manju_' + Date.now() + '.png';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // 保存到资源库
        function saveToResource() {
            if (!currentImage) return;
            
            let resources = JSON.parse(localStorage.getItem('manju_resources') || '[]');
            resources.unshift({
                id: 'res_' + Date.now(),
                name: document.getElementById('prompt-input').value.substring(0, 20) + '...',
                url: currentImage.url,
                type: 'image',
                category: 'AI生成-' + currentModel,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('manju_resources', JSON.stringify(resources));
            
            renderResources();
            alert('已保存到资源库');
        }
        
        // 记录生成历史
        function recordGeneration() {
            let records = JSON.parse(localStorage.getItem('manju_generation_history') || '[]');
            records.push({
                time: new Date().toISOString(),
                count: 1
            });
            localStorage.setItem('manju_generation_history', JSON.stringify(records));
        }
        
        // 检查今日是否已生成
        function hasGeneratedToday() {
            let records = JSON.parse(localStorage.getItem('manju_generation_history') || '[]');
            const today = new Date().toISOString().split('T')[0];
            const count = records.filter(r => r.time.startsWith(today)).reduce((sum, r) => sum + r.count, 0);
            return count >= 1;
        }
        
        // 渲染资源库
        function renderResources() {
            const resources = JSON.parse(localStorage.getItem('manju_resources') || '[]');
            const container = document.getElementById('resource-list');
            
            if (resources.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 12px; margin-top: 20px;">暂无资源</p>';
                return;
            }
            
            let html = '';
            resources.slice(0, 6).forEach(res => {
                html += `
                    <div class="resource-item" onclick="window.open('${res.url}', '_blank')">
                        <img src="${res.url}" alt="${res.name}" class="resource-thumb">
                        <div class="resource-info">
                            <div class="resource-name">${res.name}</div>
                            <div class="resource-meta">${res.category}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // API配置弹窗
        function showApiModal() {
            document.getElementById('api-modal').style.display = 'flex';
            
            // 加载保存的配置
            const savedConfig = JSON.parse(localStorage.getItem('manju_api_config') || '{}');
            if (savedConfig.grsaiKey) document.getElementById('grsai-key').value = savedConfig.grsaiKey;
            if (savedConfig.juziKey) document.getElementById('juzi-key').value = savedConfig.juziKey;
        }
        
        function closeApiModal() {
            document.getElementById('api-modal').style.display = 'none';
        }
        
        function saveApiConfig() {
            const grsaiKey = document.getElementById('grsai-key').value;
            const juziKey = document.getElementById('juzi-key').value;
            
            const config = { grsaiKey, juziKey };
            localStorage.setItem('manju_api_config', JSON.stringify(config));
            
            closeApiModal();
            alert('API配置已保存');
        }
        
        // 项目弹窗
        function showProjectModal() {
            alert('项目管理功能开发中...');
        }
        
        // 切换工作区标签
        function switchWorkTab(tab) {
            document.querySelectorAll('.work-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab !== 'ai') {
                alert('该功能开发中，敬请期待...');
            }
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            renderResources();
        });
        
        // 点击预览弹窗外部关闭
        document.getElementById('preview-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePreview();
            }
        });
    </script>
</body>
</html>
